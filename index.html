<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoDoc — Production Workspace</title>
<link rel="stylesheet" href="src/styles.css">
<style>
.artifact-banner{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:12px 14px;margin-bottom:12px;background:#0d141c;border:1px solid var(--line);border-radius:8px}.artifact-banner strong,.artifact-banner small{display:block}.artifact-banner strong{font-size:13px;margin:4px 0}.artifact-banner small{color:#718093}.artifact-actions{display:flex;gap:7px;flex-wrap:wrap}.artifact-flow{display:flex;align-items:stretch;overflow:auto;padding:15px}.flow-item{position:relative;min-width:130px;padding:10px 28px 10px 10px;border-right:1px solid var(--line)}.flow-item:last-child{border:0}.flow-item b,.flow-item small{display:block}.flow-item small{color:#718093;margin-top:4px;font-size:10px}.flow-num{font-size:9px;color:#6f7d8d}.flow-item i{position:absolute;right:7px;top:30px;color:#4f6278;font-style:normal}.artifact-principle{margin-top:12px}.project-list{display:grid;gap:8px}.project-row{display:grid;grid-template-columns:1fr 180px 120px 80px;align-items:center;gap:15px;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px}.project-row>div:first-child{display:grid;grid-template-columns:12px 1fr;align-items:center;column-gap:8px}.project-row>div:first-child small{grid-column:2;color:#718093;margin-top:3px}.project-stage span,.project-stage b{display:block}.project-stage span{font-size:9px;color:#6f7d8d;text-transform:uppercase;letter-spacing:.08em}.project-stage b{margin-top:4px}.version-strip{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;margin-top:10px;border-top:1px solid var(--line);color:#718093;font-size:10px}.version-strip b{color:#e9eef5}.version-strip .current{color:#4ade80}.visual-summary{display:flex;align-items:center;gap:14px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:11px}.visual-summary span{color:#718093}.visual-summary .muted{margin-left:auto}.export-row{display:flex;gap:7px;margin-top:14px}.render-steps{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;color:#718093;font-size:11px}.render-steps span{padding:6px 8px;border:1px solid var(--line);border-radius:5px}.render-steps .done{color:#4ade80;border-color:#1b5636}.inspector-meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0;color:#8190a1}.inspector-meta b{color:#647386;font-size:9px;text-transform:uppercase;letter-spacing:.08em}.inspector-meta span{color:#d5dce5}.link{border:0;background:none;color:#60a5fa;padding:5px}.status.red{background:var(--red)}
@media(max-width:900px){.artifact-banner{align-items:flex-start;flex-direction:column}.project-row{grid-template-columns:1fr 120px}.project-row>button{grid-column:2}.artifact-flow{display:grid;grid-template-columns:repeat(2,1fr)}.flow-item{border-bottom:1px solid var(--line)}}
@media(max-width:600px){.artifact-flow{grid-template-columns:1fr}.project-row{grid-template-columns:1fr}.project-row>button{grid-column:auto}.visual-summary{flex-wrap:wrap}.visual-summary .muted{margin-left:0}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="src/app.js"></script>
<script type="module" src="src/research-ui.js"></script>
<script type="module" src="src/script-ui.js"></script>
<script type="module" src="src/scenes-ui.js"></script>
<script type="module" src="src/voiceover-ui.js"></script>
<script type="module" src="src/timestamps-ui.js"></script>
<script type="module" src="src/v33-ui.js"></script>
<script type="module" src="src/edit-ui.js"></script>
<script type="module" src="src/project-creation.js"></script>
</body>
</html>
