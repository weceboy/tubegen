services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tubegen
      POSTGRES_PASSWORD: tubegen
      POSTGRES_DB: tubegen
    ports:
      - "5432:5432"
    volumes:
      - tubegen-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tubegen -d tubegen"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tubegen-postgres:
